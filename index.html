<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영업 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --blue:#2563eb;
    --blue-dark:#1d4ed8;
    --blue-light:#bfdbfe;
    --blue-bg:#eff6ff;
    --text:#0f172a;
    --sub:#64748b;
    --line:#e5e7eb;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:#fff;color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1200px;margin:0 auto;padding:24px 16px 48px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
  header h1{font-size:24px;font-weight:800;letter-spacing:-0.02em}
  header .month{font-size:14px;color:var(--sub);font-weight:500}
  header .month b{color:var(--blue);font-weight:700}

  .error{display:none;background:#fef2f2;border:1px solid #fecaca;color:#991b1b;
    padding:14px 16px;border-radius:12px;margin-bottom:16px;font-size:14px;line-height:1.6}

  .panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}
  .panel h2{font-size:16px;font-weight:700;margin-bottom:14px;letter-spacing:-0.01em}
  .muted{color:var(--sub);font-size:14px}

  /* 카드 4개 */
  .cards{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:12px;margin-bottom:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;min-width:0}
  .card .label{font-size:13px;color:var(--sub);font-weight:600;margin-bottom:8px}
  .card .value{font-size:22px;font-weight:800;letter-spacing:-0.02em;overflow-wrap:anywhere;line-height:1.25}
  .card .note{font-size:13px;color:var(--sub);margin-top:6px}
  .card.main{background:var(--blue-bg);border-color:var(--blue-light)}
  .card.main .value{font-size:clamp(28px,4.2vw,40px);color:var(--blue-dark)}
  .bar-track{height:10px;background:#fff;border-radius:99px;overflow:hidden;margin-top:14px;border:1px solid var(--blue-light)}
  .bar-fill{height:100%;background:var(--blue);border-radius:99px;width:0;transition:width .8s ease}
  .pct-row{display:flex;justify-content:space-between;font-size:13px;margin-top:8px;color:var(--sub)}
  .pct-row b{color:var(--blue-dark);font-size:15px}

  /* 그리드 */
  .row{display:grid;gap:16px;margin-bottom:16px}
  .row.top{grid-template-columns:1.5fr 1fr}
  .row.bottom{grid-template-columns:1fr 1fr}

  /* 막대그래프 */
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin:-4px 0 8px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px}
  .legend i.dash{height:0;border-top:2px dashed #475569;border-radius:0;width:16px}
  #barChart{width:100%}
  #barChart svg{display:block;width:100%;height:auto}

  /* 깔때기 */
  .funnel{display:flex;flex-direction:column;align-items:center}
  .f-bar{height:44px;border-radius:10px;display:flex;align-items:center;justify-content:space-between;
    gap:8px;padding:0 14px;color:#fff;font-size:14px;font-weight:600;min-width:0;transition:width .6s ease}
  .f-bar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .f-bar b{font-weight:800;white-space:nowrap}
  .conv{font-size:12px;color:var(--blue-dark);font-weight:700;padding:6px 0}
  .final{margin-top:16px;width:100%;background:var(--blue-bg);border:1px solid var(--blue-light);
    border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
  .final b{color:var(--blue-dark);font-size:22px;font-weight:800}
  .final small{display:block;color:var(--sub);font-size:11px;margin-top:2px}

  /* 순위 */
  .rank-item{margin-bottom:14px}
  .rank-item:last-child{margin-bottom:0}
  .rank-top{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:6px}
  .rank-top .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rank-top .name em{font-style:normal;color:var(--sub);font-weight:500;margin-right:6px}
  .rank-top .amt{font-weight:700;white-space:nowrap}
  .rank-track{height:10px;background:#f1f5f9;border-radius:99px;overflow:hidden}
  .rank-fill{height:100%;border-radius:99px;background:var(--blue-light);width:0;transition:width .8s ease}
  .rank-item.first .rank-fill{background:var(--blue)}

  @media (max-width:1000px){
    .cards{grid-template-columns:1fr 1fr}
    .card.main{grid-column:span 2}
  }
  @media (max-width:820px){
    .row.top,.row.bottom{grid-template-columns:1fr}
  }
  @media (max-width:520px){
    .wrap{padding:16px 12px 40px}
    header h1{font-size:20px}
    .panel{padding:16px}
    .card{padding:14px 16px}
    .card.sec-wide{grid-column:span 2}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>영업 대시보드</h1>
    <div class="month" id="monthLabel">불러오는 중…</div>
  </header>

  <div class="error" id="errorBox"></div>

  <!-- 카드 4개 -->
  <section class="cards">
    <div class="card main">
      <div class="label">이번 달 매출</div>
      <div class="value" id="cRevenue">-</div>
      <div class="bar-track"><div class="bar-fill" id="cBar"></div></div>
      <div class="pct-row"><span>목표 대비 달성률</span><b id="cPct">-</b></div>
    </div>
    <div class="card sec-wide">
      <div class="label">이번 달 목표</div>
      <div class="value" id="cTarget">-</div>
      <div class="note" id="cRemain">-</div>
    </div>
    <div class="card">
      <div class="label">객단가</div>
      <div class="value" id="cAvg">-</div>
      <div class="note">매출 ÷ 계약 건수</div>
    </div>
    <div class="card">
      <div class="label">계약 건수</div>
      <div class="value" id="cContracts">-</div>
      <div class="note" id="cContractsNote">-</div>
    </div>
  </section>

  <!-- 월별 매출 + 깔때기 -->
  <section class="row top">
    <div class="panel">
      <h2>월별 매출</h2>
      <div class="legend">
        <span><i style="background:var(--blue-dark)"></i>이번 달</span>
        <span><i style="background:var(--blue-light)"></i>이전 달</span>
        <span><i class="dash"></i>목표</span>
      </div>
      <div id="barChart"><p class="muted">불러오는 중…</p></div>
    </div>
    <div class="panel">
      <h2>영업 단계</h2>
      <div class="funnel" id="funnel"><p class="muted">불러오는 중…</p></div>
    </div>
  </section>

  <!-- 순위 -->
  <section class="row bottom">
    <div class="panel">
      <h2>담당자별 순위</h2>
      <div id="rankPerson"><p class="muted">불러오는 중…</p></div>
    </div>
    <div class="panel">
      <h2>상품별 순위</h2>
      <div id="rankProduct"><p class="muted">불러오는 중…</p></div>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://nxcpebhatifmqgqfdfyf.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_WeRxoffD6MIu0u3ulM2Lvw_qIJl1Jjk';
  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_KEY);

  /* ---------- 도우미 ---------- */
  const $ = (id) => document.getElementById(id);
  const num = (v) => Number(v) || 0;
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const won = (n) => Math.round(n).toLocaleString('ko-KR') + '원';
  function short(n) {
    const a = Math.abs(n);
    if (a >= 1e8) return (n / 1e8).toFixed(a >= 1e9 ? 1 : 2).replace(/\.?0+$/, '') + '억';
    if (a >= 1e4) return Math.round(n / 1e4).toLocaleString('ko-KR') + '만';
    return Math.round(n).toLocaleString('ko-KR');
  }
  function monthText(s) {
    const t = String(s);
    let m = t.match(/(\d{4})[-./](\d{1,2})/);
    if (m) return Number(m[2]) + '월';
    return t;
  }

  let monthly = [];

  /* ---------- 카드 ---------- */
  function drawCards(pipeline) {
    const cur = monthly[monthly.length - 1];
    const revenue = num(cur.revenue);
    const target = num(cur.target);
    const contracts = pipeline.length ? num(pipeline[pipeline.length - 1].count) : 0;

    $('monthLabel').innerHTML = '기준: <b>' + esc(monthText(cur.month)) + '</b>';
    $('cRevenue').textContent = won(revenue);

    const pct = target > 0 ? (revenue / target) * 100 : 0;
    $('cPct').textContent = target > 0 ? pct.toFixed(1) + '%' : '-';
    requestAnimationFrame(() => { $('cBar').style.width = Math.min(pct, 100) + '%'; });

    $('cTarget').textContent = won(target);
    const remain = target - revenue;
    $('cRemain').textContent = remain > 0
      ? '남은 금액 ' + won(remain)
      : '목표 달성! (초과 ' + won(-remain) + ')';

    $('cAvg').textContent = contracts > 0 ? won(revenue / contracts) : '-';
    $('cContracts').textContent = contracts.toLocaleString('ko-KR') + '건';
    $('cContractsNote').textContent = pipeline.length ? '마지막 단계: ' + pipeline[pipeline.length - 1].stage : '';
  }

  /* ---------- 월별 막대그래프 (SVG) ---------- */
  function drawBars() {
    const box = $('barChart');
    if (!monthly.length) { box.innerHTML = '<p class="muted">데이터가 없어요.</p>'; return; }
    const W = Math.max(280, box.clientWidth);
    const H = W < 500 ? 260 : 300;
    const m = { t: 26, r: 8, b: 30, l: W < 400 ? 36 : 44 };
    const n = monthly.length;
    const maxV = (Math.max(...monthly.map((r) => Math.max(num(r.revenue), num(r.target)))) * 1.12) || 1;
    const slot = (W - m.l - m.r) / n;
    const bw = Math.min(slot * 0.6, 44);
    const y = (v) => m.t + (H - m.t - m.b) * (1 - v / maxV);
    const base = y(0);
    let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="월별 매출 막대그래프">';

    // 가로 눈금
    for (let i = 0; i <= 4; i++) {
      const v = (maxV / 4) * i;
      const yy = y(v);
      s += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + yy + '" y2="' + yy + '" stroke="#eef2f7" stroke-width="1"/>';
      s += '<text x="' + (m.l - 6) + '" y="' + (yy + 4) + '" text-anchor="end" font-size="10" fill="#94a3b8">' + short(v) + '</text>';
    }

    monthly.forEach((r, i) => {
      const rev = num(r.revenue);
      const tgt = num(r.target);
      const isCur = i === n - 1;
      const x0 = m.l + slot * i;
      const bx = x0 + (slot - bw) / 2;
      const by = y(rev);
      const fill = isCur ? '#1d4ed8' : '#bfdbfe';
      s += '<rect x="' + bx + '" y="' + by + '" width="' + bw + '" height="' + Math.max(0, base - by) + '" rx="4" fill="' + fill + '"><title>' +
        esc(monthText(r.month)) + ' 매출 ' + won(rev) + ' / 목표 ' + won(tgt) + '</title></rect>';

      // 금액 라벨 (공간이 좁으면 이번 달만)
      if (slot >= 46 || isCur) {
        s += '<text x="' + (x0 + slot / 2) + '" y="' + (by - 6) + '" text-anchor="middle" font-size="11" font-weight="' + (isCur ? 800 : 600) +
          '" fill="' + (isCur ? '#1d4ed8' : '#64748b') + '">' + short(rev) + '</text>';
      }
      // 월 라벨
      if (slot >= 30 || (n - 1 - i) % 2 === 0) {
        s += '<text x="' + (x0 + slot / 2) + '" y="' + (H - 10) + '" text-anchor="middle" font-size="11" font-weight="' + (isCur ? 800 : 500) +
          '" fill="' + (isCur ? '#1d4ed8' : '#64748b') + '">' + esc(monthText(r.month)) + '</text>';
      }
      // 목표 점선 (월별)
      if (tgt > 0) {
        const ty = y(tgt);
        s += '<line x1="' + x0 + '" x2="' + (x0 + slot) + '" y1="' + ty + '" y2="' + ty + '" stroke="#475569" stroke-width="2" stroke-dasharray="5 4"/>';
      }
    });

    s += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + base + '" y2="' + base + '" stroke="#cbd5e1" stroke-width="1"/>';
    s += '</svg>';
    box.innerHTML = s;
  }

  /* ---------- 깔때기 ---------- */
  function drawFunnel(rows) {
    const el = $('funnel');
    if (!rows.length) { el.innerHTML = '<p class="muted">데이터가 없어요.</p>'; return; }
    const first = num(rows[0].count);
    let h = '';
    rows.forEach((r, i) => {
      if (i > 0) {
        const prev = num(rows[i - 1].count);
        const rate = prev > 0 ? (num(r.count) / prev * 100).toFixed(1) + '%' : '-';
        h += '<div class="conv">▼ 전환율 ' + rate + '</div>';
      }
      const w = first > 0 ? Math.max(40, num(r.count) / first * 100) : 100;
      const light = 56 - (rows.length > 1 ? (i / (rows.length - 1)) * 22 : 0);
      h += '<div class="f-bar" style="width:' + w + '%;background:hsl(221,83%,' + light.toFixed(0) + '%)">' +
        '<span>' + esc(r.stage) + '</span><b>' + num(r.count).toLocaleString('ko-KR') + '</b></div>';
    });
    const last = num(rows[rows.length - 1].count);
    const finalRate = first > 0 ? (last / first * 100).toFixed(1) + '%' : '-';
    h += '<div class="final"><div>최종 전환율<small>' + esc(rows[rows.length - 1].stage) + ' ÷ ' + esc(rows[0].stage) +
      '</small></div><b>' + finalRate + '</b></div>';
    el.innerHTML = h;
  }

  /* ---------- 순위 ---------- */
  function drawRank(targetId, rows) {
    const el = $(targetId);
    if (!rows.length) { el.innerHTML = '<p class="muted">데이터가 없어요.</p>'; return; }
    const sorted = rows.slice().sort((a, b) => num(b.amount) - num(a.amount));
    const max = num(sorted[0].amount) || 1;
    el.innerHTML = sorted.map((r, i) =>
      '<div class="rank-item' + (i === 0 ? ' first' : '') + '">' +
        '<div class="rank-top"><span class="name"><em>' + (i + 1) + '</em>' + esc(r.name) + '</span>' +
        '<span class="amt">' + won(num(r.amount)) + '</span></div>' +
        '<div class="rank-track"><div class="rank-fill" data-w="' + (num(r.amount) / max * 100) + '"></div></div>' +
      '</div>'
    ).join('');
    requestAnimationFrame(() => {
      el.querySelectorAll('.rank-fill').forEach((f) => { f.style.width = f.dataset.w + '%'; });
    });
  }

  /* ---------- 불러오기 ---------- */
  async function load() {
    try {
      const [m, p, r] = await Promise.all([
        db.from('sales_monthly').select('*').order('sort_order', { ascending: true }),
        db.from('sales_pipeline').select('*').order('sort_order', { ascending: true }),
        db.from('sales_rank').select('*')
      ]);
      const err = m.error || p.error || r.error;
      if (err) throw err;

      monthly = m.data || [];
      const pipeline = p.data || [];
      const ranks = r.data || [];

      if (monthly.length) drawCards(pipeline);
      else $('monthLabel').textContent = '월별 데이터 없음';
      drawBars();
      drawFunnel(pipeline);
      drawRank('rankPerson', ranks.filter((x) => x.kind === 'person'));
      drawRank('rankProduct', ranks.filter((x) => x.kind === 'product'));
    } catch (e) {
      const box = $('errorBox');
      box.style.display = 'block';
      box.innerHTML = '<b>데이터를 불러오지 못했어요.</b><br>인터넷 연결과 Supabase 설정(테이블 읽기 권한)을 확인해 주세요.<br><small>' +
        esc(e && e.message ? e.message : e) + '</small>';
      $('monthLabel').textContent = '불러오기 실패';
      ['barChart', 'funnel', 'rankPerson', 'rankProduct'].forEach((id) => { $(id).innerHTML = '<p class="muted">-</p>'; });
    }
  }

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (monthly.length) drawBars(); }, 120);
  });

  load();
</script>
</body>
</html>
